name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: inventory

    steps:
      - uses: actions/checkout@v5

      - name: Apply scripts (twice to verify idempotency)
        run: |
          for run in 1 2; do
            for script in database/[0-9][0-9]_*.sql; do
              psql -q -v ON_ERROR_STOP=1 -f "$script"
            done
          done

      - name: Run database tests
        run: |
          for test in database/tests/*.test.sql; do
            psql -q -v ON_ERROR_STOP=1 -f "$test"
          done

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INVENTORY_TEST_CONNECTION: Host=localhost;Port=5432;Database=inventory_test;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Inventory.slnx

      - name: Build
        run: dotnet build Inventory.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Inventory.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Build (production)
        run: npx ng build

  docker:
    name: Docker Compose (end-to-end)
    runs-on: ubuntu-latest
    needs: [database, backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:4200/ | grep -q '<app-root>'
          curl -fsS http://localhost:4200/health | grep -q Healthy
          token=$(curl -fsS -X POST http://localhost:4200/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Admin123*"}' | jq -r .accessToken)
          curl -fsS http://localhost:4200/api/stock -H "Authorization: Bearer $token" | jq -e '.totalCount > 0'
          curl -fsS -o /dev/null http://localhost:5197/swagger/index.html

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down --volumes
