# Sirve la aplicación Angular y reenvía la API al contenedor "api".
# Front y API quedan en el mismo origen, por eso en producción environment.apiUrl es '' y no hace falta CORS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # index.html nunca se cachea, así cada despliegue carga los archivos nuevos;
    # los .js y .css llevan un hash en el nombre y pueden cachearse mucho tiempo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Las rutas de Angular (/products, /stock…) las resuelve el navegador: se devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
